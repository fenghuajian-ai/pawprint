<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境电商 AI 全流程自动化管线</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --blue:#3b82f6; --green:#22c55e; --yellow:#eab308; --red:#ef4444; --text:#e2e8f0; --gray:#94a3b8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .header { text-align:center; padding:40px 20px 20px; }
  .header h1 { font-size:2rem; background:linear-gradient(135deg, var(--blue), #8b5cf6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .header p { color:var(--gray); margin-top:8px; }
  .input-row { display:flex; gap:12px; justify-content:center; margin:20px; flex-wrap:wrap; }
  .input-row input { padding:12px 16px; border-radius:8px; border:1px solid #334155; background:#1e293b; color:#fff; font-size:1rem; width:200px; }
  .input-row button { padding:12px 28px; border-radius:8px; border:none; background:var(--blue); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; transition:all .2s; }
  .input-row button:hover { background:#2563eb; transform:translateY(-1px); }
  .input-row button:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .pipeline { display:flex; justify-content:center; gap:8px; margin:30px 10px; flex-wrap:wrap; }
  .stage { background:var(--card); border-radius:10px; padding:16px; width:130px; text-align:center; transition:all .5s; opacity:.3; border:2px solid transparent; }
  .stage.active { opacity:1; border-color:var(--blue); box-shadow:0 0 20px rgba(59,130,246,.3); }
  .stage.done { opacity:1; border-color:var(--green); }
  .stage .icon { font-size:2rem; margin-bottom:4px; }
  .stage .name { font-size:.85rem; font-weight:600; }
  .stage .time { font-size:.7rem; color:var(--gray); margin-top:4px; }
  .output { max-width:900px; margin:0 auto; padding:0 20px; }
  .output .card { background:var(--card); border-radius:12px; padding:24px; margin:16px 0; display:none; }
  .output .card.show { display:block; animation:fadeIn .4s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .card h3 { color:var(--blue); margin-bottom:12px; font-size:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th { text-align:left; padding:8px 10px; color:var(--gray); font-weight:600; border-bottom:1px solid #334155; }
  td { padding:8px 10px; border-bottom:1px solid #1e293b; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:.72rem; font-weight:600; }
  .tag-red { background:#7f1d1d; color:#fca5a5; }
  .tag-yellow { background:#713f12; color:#fde68a; }
  .tag-green { background:#14532d; color:#86efac; }
  .tag-blue { background:#1e3a5f; color:#93c5fd; }
  .totals { display:flex; gap:12px; flex-wrap:wrap; margin-top:16px; }
  .total { flex:1; min-width:120px; background:#0f172a; border-radius:8px; padding:16px; text-align:center; }
  .total .num { font-size:1.5rem; font-weight:800; color:var(--green); }
  .total .label { font-size:.75rem; color:var(--gray); margin-top:4px; }
  .log { font-family:monospace; font-size:.8rem; color:var(--gray); margin-top:8px; line-height:1.8; }
  .footer { text-align:center; padding:30px; color:var(--gray); font-size:.8rem; }
</style>
</head>
<body>
<div class="header">
  <h1>跨境电商 AI 全流程自动化管线</h1>
  <p>输入品类 → 4 阶段自动运行 → 输出可交付结果</p>
</div>

<div class="input-row">
  <input id="product" value="蓝牙耳机" placeholder="品类名称">
  <input id="market" value="US" placeholder="目标市场" style="width:100px">
  <button id="runBtn" onclick="runPipeline()">启动全流程</button>
</div>

<div class="pipeline">
  <div class="stage" id="s1"><div class="icon">🔍</div><div class="name">市场扫描</div><div class="time">~2 min</div></div>
  <div class="stage" id="s2"><div class="icon">📊</div><div class="name">竞品拆解</div><div class="time">~10 min</div></div>
  <div class="stage" id="s3"><div class="icon">📝</div><div class="name">Listing 生成+审核</div><div class="time">~10 min</div></div>
  <div class="stage" id="s4"><div class="icon">🚨</div><div class="name">监控部署</div><div class="time">~5 min</div></div>
</div>

<div class="output">
  <div class="card" id="out1">
    <h3>阶段 1：市场扫描</h3>
    <div class="log" id="log1"></div>
  </div>
  <div class="card" id="out2">
    <h3>阶段 2：竞品采集 + AI 差评分类</h3>
    <table id="compTable"></table>
    <div class="log" id="log2" style="margin-top:12px;"></div>
  </div>
  <div class="card" id="out3">
    <h3>阶段 3：AI 生成 Listing + 质量审核</h3>
    <div class="log" id="log3"></div>
    <table id="auditTable" style="margin-top:12px;"></table>
  </div>
  <div class="card" id="out4">
    <h3>阶段 4：竞品监控自动部署</h3>
    <div class="log" id="log4"></div>
  </div>
  <div class="card" id="outSummary">
    <h3>全流程完成</h3>
    <div class="totals">
      <div class="total"><div class="num">4</div><div class="label">自动化阶段</div></div>
      <div class="total"><div class="num">~27min</div><div class="label">AI 管线总耗时</div></div>
      <div class="total"><div class="num">8h</div><div class="label">传统人工耗时</div></div>
      <div class="total"><div class="num">16x</div><div class="label">效率提升</div></div>
    </div>
  </div>
</div>
<div class="footer">纯 Python 标准库 · 无外部依赖 · 任意品类复用</div>

<script>
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeLog(id, lines) {
  const el = document.getElementById(id);
  for (const line of lines) {
    el.innerHTML += line + '<br>';
    await sleep(200);
  }
}

function buildCompTable(product) {
  const data = [
    ["TOZO A1","$12.99","4.3★","105K","蓝牙断连、通话不清晰","<span class='tag tag-red'>极高</span>"],
    ["JLab Go Air Pop+","$17.49","4.4★","10K","低音量感不足","<span class='tag tag-yellow'>中</span>"],
    ["Soundcore P20i","$19.99","4.4★","79K","低音浑浊、佩戴不适","<span class='tag tag-yellow'>中</span>"],
  ];
  const table = document.getElementById("compTable");
  table.innerHTML = "<tr><th>竞品</th><th>价格</th><th>评分</th><th>评论数</th><th>Top 投诉</th><th>关注度</th></tr>";
  for (const d of data) {
    table.innerHTML += `<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td>${d[3]}</td><td>${d[4]}</td><td>${d[5]}</td></tr>`;
  }
}

function buildAuditTable() {
  const checks = [
    ["关键词密度","✓","PASS","Bluetooth 5.3/ENC/IPX5/防水 已覆盖"],
    ["FTC 合规","✓","PASS","无 Best/#1 等最高级虚假宣称"],
    ["差评回应","✓","PASS","断连、通话、续航、佩戴 四个痛点均有回应"],
    ["文化敏感度","✓","PASS","US 站用语已检查，无文化踩雷风险"],
    ["可执行性","✓","PASS","每条卖点有具体参数，非堆砌功能"],
  ];
  const table = document.getElementById("auditTable");
  table.innerHTML = "<tr><th>检查项</th><th>结果</th><th>状态</th><th>备注</th></tr>";
  for (const c of checks) {
    table.innerHTML += `<tr><td>${c[0]}</td><td>${c[1]}</td><td><span class='tag tag-green'>${c[2]}</span></td><td>${c[3]}</td></tr>`;
  }
}

async function runPipeline() {
  const btn = document.getElementById("runBtn");
  const product = document.getElementById("product").value || "蓝牙耳机";
  const market = document.getElementById("market").value || "US";
  btn.disabled = true;
  btn.textContent = "运行中...";

  // Reset
  document.querySelectorAll(".stage").forEach(s => { s.classList.remove("active","done"); });
  document.querySelectorAll(".card").forEach(c => c.classList.remove("show"));
  document.querySelectorAll(".log").forEach(l => l.innerHTML = "");

  // Stage 1
  const s1 = document.getElementById("s1");
  s1.classList.add("active");
  document.getElementById("out1").classList.add("show");
  await typeLog("log1", [
    `> 启动 ${market} 站 ${product} 市场扫描...`,
    `> 实际生产：调用 Keepa API 获取实时类目数据`,
    `> 扫描完成：`,
    `  - 品类规模: 约 $2.4B（全球 TWS 市场）`,
    `  - 在售 SKU: 15,000+`,
    `  - 主力价格带: $13-20（走量）| $25-35（差异化）`,
    `  - 机会区间: $25-35 带 ANC 功能，消费者愿溢价 50%`,
  ]);
  await sleep(800);
  s1.classList.remove("active"); s1.classList.add("done");

  // Stage 2
  await sleep(500);
  const s2 = document.getElementById("s2");
  s2.classList.add("active");
  document.getElementById("out2").classList.add("show");
  buildCompTable(product);
  await typeLog("log2", [
    `> Playwright 自动打开 4 个竞品页面...`,
    `> 抓取价格、评分、评论数完成`,
    `> Claude API 批量分析差评 → 5 个高频痛点已归类`,
    `> 最高频: 蓝牙断连（涉及 TOZO A1 / P20i）`,
  ]);
  await sleep(800);
  s2.classList.remove("active"); s2.classList.add("done");

  // Stage 3
  await sleep(500);
  const s3 = document.getElementById("s3");
  s3.classList.add("active");
  document.getElementById("out3").classList.add("show");
  await typeLog("log3", [
    `> Claude API 生成 ${product} Listing...`,
    `  标题: ${product} Bluetooth 5.3, 40H Playtime IPX5, Quad-Mic ENC for Clear Calls`,
    `  五点: [续航] [通话质量] [蓝牙稳定] [防水+舒适] [参数不注水]`,
    `> 每条卖点均回应了竞品差评中的真实痛点`,
  ]);
  buildAuditTable();
  await sleep(800);
  s3.classList.remove("active"); s3.classList.add("done");

  // Stage 4
  await sleep(500);
  const s4 = document.getElementById("s4");
  s4.classList.add("active");
  document.getElementById("out4").classList.add("show");
  await typeLog("log4", [
    `> 配置竞品监控告警规则:`,
    `  - 降价 >15% → 飞书实时推送`,
    `  - 新增一星差评 >2 条 → 当天分析原因`,
    `  - 评分下降 >0.3 → 3h 内复查`,
    `  - BSR 下降 >50 位 → 标记关注`,
    `> 每日 09:00 自动运行，异常实时告警`,
    `> 监控已部署，永久自动运行`,
  ]);
  await sleep(800);
  s4.classList.remove("active"); s4.classList.add("done");

  // Summary
  await sleep(500);
  document.getElementById("outSummary").classList.add("show");

  btn.disabled = false;
  btn.textContent = "启动全流程";
}
</script>
</body>
</html>
